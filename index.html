<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aster — Resume Studio</title>
  <meta name="description" content="Build a clean, professional résumé in your browser. Edit live, save locally and print to PDF — no account, no tracking." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="#"><span>✳</span> Aster <em>Resume Studio</em></a>
    <div class="bar-actions">
      <button id="loadBtn" class="btn ghost">Import JSON</button>
      <button id="saveBtn" class="btn ghost">Export JSON</button>
      <button id="resetBtn" class="btn ghost">Reset</button>
      <button id="printBtn" class="btn">Print / Save PDF</button>
      <input id="fileInput" type="file" accept="application/json" hidden />
    </div>
  </header>

  <main class="workspace">
    <section class="editor" aria-label="Resume editor">
      <div class="editor-head"><h1>Your details</h1><p>Everything saves automatically in this browser.</p></div>

      <fieldset>
        <legend>Profile</legend>
        <div class="row">
          <label>Full name<input data-field="name" placeholder="Eugine Nyariki" /></label>
          <label>Headline<input data-field="title" placeholder="Full-stack developer" /></label>
        </div>
        <div class="row">
          <label>Email<input data-field="email" type="email" placeholder="you@example.com" /></label>
          <label>Phone<input data-field="phone" placeholder="+254 712 345 678" /></label>
        </div>
        <div class="row">
          <label>Location<input data-field="location" placeholder="Nairobi, Kenya" /></label>
          <label>Links<input data-field="links" placeholder="github.com/you · linkedin.com/in/you" /></label>
        </div>
        <label>Summary<textarea data-field="summary" rows="3" placeholder="Two or three sentences about the value you bring."></textarea></label>
      </fieldset>

      <fieldset>
        <legend>Experience <button class="add" data-add="experience">+ Add role</button></legend>
        <div id="experienceList" class="items"></div>
      </fieldset>

      <fieldset>
        <legend>Education <button class="add" data-add="education">+ Add school</button></legend>
        <div id="educationList" class="items"></div>
      </fieldset>

      <fieldset>
        <legend>Projects <button class="add" data-add="projects">+ Add project</button></legend>
        <div id="projectsList" class="items"></div>
      </fieldset>

      <fieldset>
        <legend>Skills</legend>
        <label>Comma-separated skills<input data-field="skills" placeholder="TypeScript, Next.js, PostgreSQL, Azure" /></label>
      </fieldset>
    </section>

    <section class="preview-wrap" aria-label="Resume preview">
      <div class="preview-label">Live preview <span id="updated">Saved</span></div>
      <article id="resume" class="resume"></article>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
